name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pull requests only from forks; own branches are already built on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pinned, so a new Xcode on the runner doesn't turn builds red overnight.
      # Raise it together with the Xcode used in Xcode Cloud.
      XCODE_APP: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Versions
        run: xcodebuild -version

      - name: Build app and share extension
        run: |
          xcodebuild -project Recipe2Mealie.xcodeproj -scheme Recipe2Mealie \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test MealieKit
        working-directory: Packages/MealieKit
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Testing on $DEVICE"
          xcodebuild -scheme MealieKit -destination "platform=iOS Simulator,name=$DEVICE" test
