name: Feature idea
description: Suggest something that would make the app better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please write in English so everyone can follow along.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help you with?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
  - type: input
    id: ios-version
    attributes:
      label: iOS version and device
  - type: input
    id: mealie-version
    attributes:
      label: Mealie version
